version: 2

sources:
  - name: raw
    description: >
      Untyped landing tables loaded from the partitioned raw zone by
      ingestion/load_raw.py. Every column is text here; staging casts and cleans it.
    schema: raw
    tables:
      - name: suppliers
      - name: products
      - name: stores
      - name: sales
      - name: inventory_snapshots
      - name: purchase_orders
      - name: contract_catalogue
        description: >
          One row per supplier document, describing what it is and what it replaces. The
          documents themselves are prose and are indexed separately by
          ingestion/embed_documents.py; this is the structured part of them.
